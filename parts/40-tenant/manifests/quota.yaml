apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: team-a
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 12Gi
    limits.memory: 12Gi
    pods: "30"
    requests.storage: 20Gi
    persistentvolumeclaims: "4"
    count/ingresses.networking.k8s.io: "6"
    # Disallow LoadBalancer and NodePort Services.
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limits
  namespace: team-a
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        memory: 128Mi
      max:
        memory: 2Gi
