apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: team-a
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.memory: 4Gi
    pods: "10"
    requests.storage: 20Gi
    persistentvolumeclaims: "4"
    count/ingresses.networking.k8s.io: "2"
    # Disallow LoadBalancer and NodePort Services.
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limits
  namespace: team-a
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        memory: 128Mi
      max:
        memory: 2Gi
