image:
  registry: ""
  repository: ""
  tag: ""
replicas: 2
resources:
  cpu: 250m
  memory: 512Mi
jvm:
  heapPercentage: 50
ports:
  http: 8080
  management: 8081
probes:
  livenessPath: /actuator/health/liveness
  readinessPath: /actuator/health/readiness
ingress:
  enabled: false
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilization: 70
