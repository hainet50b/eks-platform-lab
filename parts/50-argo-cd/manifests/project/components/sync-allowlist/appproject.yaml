# Patched into every AppProject; the name is replaced by the target's.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sync-allowlist
spec:
  sourceNamespaces:
    - argocd
  sourceRepos:
    - https://github.com/hainet50b/eks-platform-lab-workloads.git
  namespaceResourceWhitelist:
    - group: ""
      kind: Pod
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet
    - group: apps
      kind: ReplicaSet
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: ""
      kind: Service
    - group: networking.k8s.io
      kind: Ingress
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: ServiceAccount
