<svg class="bars" viewBox="0 0 1040 304" role="img" aria-labelledby="layers-title layers-description">
  <title id="layers-title">The layers that Docker builds again for each kind of change</title>
  <desc id="layers-description">The image has five layers, from the top: the application, the snapshot dependencies, the Spring Boot loader, the dependencies, and the base image. When a layer changes, Docker builds that layer and every layer above it again, and reuses the layers below it. When the code changes, only the application layer is built again. When a dependency changes, the dependencies layer and the three layers above it are built again. When the base image changes, every layer is built again.</desc>

  <text x="40" y="54">from the most often changed</text>
  <text class="row-label" x="40" y="89">application</text><text x="40" y="105">your classes and resources</text>
  <text class="row-label" x="40" y="133">snapshot-dependencies</text><text x="40" y="149">libraries in SNAPSHOT versions</text>
  <text class="row-label" x="40" y="177">spring-boot-loader</text><text x="40" y="193">the launcher</text>
  <text class="row-label" x="40" y="221">dependencies</text><text x="40" y="237">libraries in release versions</text>
  <text class="row-label" x="40" y="265">base image</text><text x="40" y="281">Ubuntu and the Java runtime</text>
