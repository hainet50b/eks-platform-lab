  <title id="probes-title">What the probes decide, from the start of the container</title>
  <desc id="probes-description">The startup probe checks every 5 seconds whether the application has started, and the kubelet restarts the container if it does not pass within 120 seconds. After it passes, the readiness probe checks every 5 seconds, and the liveness probe every 10 seconds. When the readiness probe fails 3 times, the Service and the ALB stop sending requests to the pod until it passes again. When the liveness probe fails 3 times, the kubelet restarts the container, and the startup probe starts again.</desc>
