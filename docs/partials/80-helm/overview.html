  <title id="overview-title">Components of part 80</title>
  <desc id="overview-description">On your machine, the developer writes the Spring Boot application, which is built into an image and pushed to the ECR repository. The developer writes the values, and the administrator writes the chart, and both are pushed to the workloads repository. The administrator also creates the ECR repository and applies manifests to the cluster, where the ApplicationSet in the namespace argocd creates the Application. The Argo CD capability reads the workloads repository and the namespace argocd, and syncs the sample workload into the namespace team-a. The sample workload consists of a Rollout, a Service, an Ingress, an HPA, and a PDB, and pulls the image from the ECR repository.</desc>
