  <title id="flow-title">How the code of the application reaches a pod</title>
  <desc id="flow-description">On your machine, git push puts the values into the workloads repository and the source code into the application repository. docker build turns the source code into an image, and docker push puts the image into the ECR repository. In the cluster, Argo CD reads the chart and the values from the workloads repository, and syncs the pod. The pod pulls the image from the ECR repository.</desc>
