  <desc id="overview-description">The administrator installs metrics-server as an EKS add-on and applies the ApplicationSet. The developer pushes the sample workload to the workloads repository. The Argo CD capability reads the workloads repository and the namespace argocd, where the ApplicationSet creates the Application, and syncs the sample workload into the namespace team-a. The HPA of the sample workload reads the CPU usage from metrics-server and scales the Rollout. The Argo Rollouts controller of part 60 reads and updates the Rollout, and creates and scales its ReplicaSets.</desc>
