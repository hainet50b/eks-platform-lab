<div class="diagram">
<svg class="scaling-steps" viewBox="0 0 1040 304" role="img" aria-labelledby="scaling-title scaling-description">
  <title id="scaling-title">How the HPA and Auto Mode take turns</title>
  <defs><pattern id="pending-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="hatch-ground" width="6" height="6"/><line class="hatch-line" x1="0" y1="0" x2="0" y2="6"/></pattern></defs>
  <desc id="scaling-description">The load rises and the HPA adds pods. With more load, the HPA adds more pods, and the ones that do not fit on node 1 are Pending. Auto Mode adds node 2, and the Pending pods run there. Five minutes after the load stops, the HPA removes pods, and one pod is left on each node. A few minutes later, Auto Mode moves the pod on node 2 to node 1 and removes node 2.</desc>
  <g><text class="title" x="0" y="18">No load</text><rect class="actor" x="0" y="28" width="29" height="20" rx="10"/><text class="actor-name" x="14.5" y="42" text-anchor="middle">HPA</text><text class="verb" x="35" y="42">keeps the minimum</text><rect class="node" x="0" y="62" width="163" height="64" rx="8"/><text class="label" x="10" y="78">node 1</text><rect class="pod-mark" x="12" y="90" width="22" height="22" rx="4"/><rect class="pod-mark" x="42" y="90" width="22" height="22" rx="4"/></g>
  <g><text class="title" x="175" y="18">Light load</text><rect class="actor" x="175" y="28" width="29" height="20" rx="10"/><text class="actor-name" x="189.5" y="42" text-anchor="middle">HPA</text><text class="verb" x="210" y="42">adds pods</text><rect class="node" x="175" y="62" width="163" height="64" rx="8"/><text class="label" x="185" y="78">node 1</text><rect class="pod-mark" x="187" y="90" width="22" height="22" rx="4"/><rect class="pod-mark" x="217" y="90" width="22" height="22" rx="4"/><rect class="pod-mark added" x="247" y="90" width="22" height="22" rx="4"/></g>
